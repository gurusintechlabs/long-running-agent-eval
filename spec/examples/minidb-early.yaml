# Early-feedback run: 1 x 2 h real Claude Code run on minidb (owner-requested, no dry run).
# Ladder task L2: an in-memory SQL engine built tier by tier (fixtures/tasks/minidb/prompt.md).
# Later tiers depend on earlier ones, so early mistakes compound. Model and CLI version are set
# ONLY here.
spec_version: 1
experiment_id: minidb-early
task:
  id: minidb
  class: L2
  prompt_file: ../../fixtures/tasks/minidb/prompt.md
  seed_repo: ../../fixtures/seed_minidb
  seed_commit: 53b58af0b1b07b10252d0fe5cad8d8b2578e0700   # runner.seed.build_seed_repo output
  seed_requirements_lock: ../../fixtures/seed_minidb/requirements.lock
  constraints_file: ../../fixtures/tasks/minidb/constraints.yaml
  hidden_tests: ../../fixtures/tasks/minidb/hidden
agent:
  runtime: claude_code
  claude_bin: claude
  claude_code_version: "2.1.301"       # must equal `claude --version` at run start
  model: claude-opus-5-5               # <- CHANGE AGENT MODEL HERE
  auto_memory: cli_default
run:
  duration_min: 120
  checkpoint_interval_min: 20          # >= the scorer's per-checkpoint throughput target
  repeats: 1
  configs: [A]
  seed: 1234
  parallelism: 1
budget:                                # subscription login: $ = API-equivalent estimate (D-16)
  per_run_usd: 40.00                   # hard kill switch (estimated $); no dry run, so this is the only bound
  experiment_usd: 40.00
isolation:
  mode: local
  work_dir: ~/lrae-work
  keep_work_dir: false
telemetry:
  protocol: http/json
  export_interval_ms: 1000
guardrails:
  policy_file: ../../guardrails/rules/default.yaml
scoring:
  judge_model: claude-opus-5-5         # <- CHANGE JUDGE MODEL HERE
  judge_samples: 3
  judge_runtime: claude_code
  thresholds:
    repeat_work_ratio: 0.30
    cost_per_commit_multiplier: 2.0
    cost_baseline_checkpoints: 2
