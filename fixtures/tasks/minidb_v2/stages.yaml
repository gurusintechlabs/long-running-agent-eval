# minidb v2: the brief arrives in stages (docs/interfaces.md §9, D-18; docs/minidb-v2-design.md).
# Stage 0 is the opening brief (task.prompt_file, constraints appended by the runtime); every later
# stage is a product-owner message delivered as soon as the agent finishes the previous one (its
# turn ends successfully). The run ends when the agent finishes stage 6, or at the deadline.
stages:
  - {id: 0, prompt: stage0.md, kind: feature}  # core engine (sections 1-7)
  - {id: 1, prompt: stage1.md, kind: feature}  # subqueries, CASE/CAST, set ops, INSERT..SELECT, derived tables
  - {id: 2, prompt: stage2.md, kind: feature}  # indexes, planner, performance limits
  - {id: 3, prompt: stage3.md, kind: change_request}  # CR-1 NULL order, CR-2 division, CR-3 storage errors
  - {id: 4, prompt: stage4.md, kind: feature}  # transactions, durable storage + crash recovery, ALTER TABLE
  - {id: 5, prompt: stage5.md, kind: feature}  # views, WITH / WITH RECURSIVE, window functions
  - {id: 6, prompt: stage6.md, kind: change_request}  # CR-4 case-preserving names, DATE type
