# How the scorer runs the jira-re hidden suite (docs/spec.md 8.1, 8.2; staged: interfaces.md §9).
# The tests only read the snapshot's files and the plugin jar in ../vendor/, harness-side (pure Python, no
# JDK, no network). The implementer's workspace has no jar (docs/jira-re-design.md §7.2).
# The scorer adds LRAE_STAGE=<active stage>; tests outside their stage window are skipped.
test_env:
  LRAE_WORKSPACE: "{ws}"
  LRAE_PYTHON: "{python}"
per_test_timeout_s: 120
suite_timeout_s: 600
