    \ndef create_app(db_path: str = \":memory:\", settings: Optional[Settings] = None) -> FastAPI:\n \
    \   \"\"\"Build an app with its own isolated store (and audit log).\"\"\"\n    settings = settings\
    \ or Settings(db_path=db_path)\n    store = Store(settings.db_path)\n    store.seed_users()\n    audit.init(store.conn)\n\
    \n    app = FastAPI(title=\"Items Service\", version=__version__)\n    app.state.settings = settings\n\
    \    app.state.store = store\n    app.state.export_limiter = RateLimiter(\n        settings.export_rate_limit,\
    \ settings.export_rate_window_s\n    )\n\n    current_user_id = make_current_user_dependency()\n\n\
    \    def get_store(request: Request) -> Store:\n        return request.app.state.store\n\n    @app.get(\"\
    /health\", response_model=HealthOut)\n    def health() -> HealthOut:\n        return HealthOut(status=\"\
    ok\", version=__version__)\n\n    @app.get(\"/users/me\", response_model=UserOut)\n    def users_me(\n\
    \        user_id: int = Depends(current_user_id), store: Store = Depends(get_store)\n    ) -> dict:\n\
    \        user = store.get_user(user_id)\n        if user is None:\n            raise HTTPException(status_code=404,\
    \ detail=\"user not found\")\n        return user\n\n    @app.get(\"/items\", response_model=ItemPage)\n\
    \    def list_items(\n        request: Request,\n        limit: Optional[int] = Query(default=None),\n\
    \        offset: Optional[int] = Query(default=None),\n        user_id: int = Depends(current_user_id),\n\
    \        store: Store = Depends(get_store),\n    ) -> dict:\n        s = request.app.state.settings\n\
    \        params = clamp_page(limit, offset, s.default_page_size, s.max_page_size)\n        return\
    \ {\n            \"items\": store.list_items(user_id, params.limit, params.offset),\n            \"\
    total\": store.count_items(user_id),\n            \"limit\": params.limit,\n            \"offset\"\
    : params.offset,\n        }\n\n    @app.get(\"/export\")\n    def export_items(\n        request:\
    \ Request,\n        limit: Optional[int] = Query(default=None),\n        offset: Optional[int] = Query(default=None),\n\
    \        user_id: int = Depends(current_user_id),\n        store: Store = Depends(get_store),\n  \
    \  ) -> Response:\n        s = request.app.state.settings\n        allowed, retry_after = request.app.state.export_limiter.hit(user_id)\n\
    \        if not allowed:\n            raise HTTPException(\n                status_code=status.HTTP_429_TOO_MANY_REQUESTS,\n\
    \                detail=\"export rate limit exceeded\",\n                headers={\"Retry-After\"\
    : str(retry_after)},\n            )\n        params = clamp_page(limit, offset, s.default_page_size,\
    \ s.max_page_size)\n        rows = store.list_items(user_id, params.limit, params.offset)\n      \
    \  buf = io.StringIO(newline=\"\")\n        writer = csv.writer(buf)\n        writer.writerow(EXPORT_COLUMNS)\n\
    \        for r in rows:\n            writer.writerow(\n                [r[\"id\"], r[\"title\"], r[\"\
    slug\"], r[\"description\"] or \"\",\n                 r[\"quantity\"], r[\"created_at\"]]\n     \
    \       )\n        audit.record(\n            user_id,\n            \"export.csv\",\n            f\"\
    rows={len(rows)} limit={params.limit} offset={params.offset}\",\n        )\n        return Response(\n\
    \            content=buf.getvalue(),\n            media_type=\"text/csv; charset=utf-8\",\n      \
    \      headers={\"X-Total-Count\": str(store.count_items(user_id))},\n        )\n\n    @app.post(\"\
    /items\", response_model=ItemOut, status_code=status.HTTP_201_CREATED)\n    def create_item(\n   \
    \     body: ItemCreate,\n        request: Request,\n        user_id: int = Depends(current_user_id),\n\
