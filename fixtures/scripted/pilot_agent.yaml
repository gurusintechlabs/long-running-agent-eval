    \ import Dict\n\nDEFAULT_PAGE_SIZE = 20\nMAX_PAGE_SIZE = 100\n\n# /export: at most this many successful\
    \ exports per user per window.\nDEFAULT_EXPORT_RATE_LIMIT = 5\nDEFAULT_EXPORT_RATE_WINDOW_S = 60.0\n\
    \n# Demo keys; real deployments override via ITEMS_API_KEYS=\"key1:1,key2:2\".\nDEFAULT_API_KEYS:\
    \ Dict[str, int] = {\n    \"key-alice\": 1,\n    \"key-bob\": 2,\n}\n\nAPI_KEY_HEADER = \"X-API-Key\"\
    \n\n\ndef _parse_keys(raw: str) -> Dict[str, int]:\n    \"\"\"Parse 'key:user_id,key:user_id' into\
    \ a mapping.\"\"\"\n    keys: Dict[str, int] = {}\n    for part in raw.split(\",\"):\n        part\
    \ = part.strip()\n        if not part:\n            continue\n        key, _, uid = part.partition(\"\
    :\")\n        if not key or not uid.isdigit():\n            raise ValueError(f\"invalid ITEMS_API_KEYS\
    \ entry: {part!r}\")\n        keys[key] = int(uid)\n    return keys\n\n\n@dataclass\nclass Settings:\n\
    \    db_path: str = \":memory:\"\n    api_keys: Dict[str, int] = field(default_factory=lambda: dict(DEFAULT_API_KEYS))\n\
    \    default_page_size: int = DEFAULT_PAGE_SIZE\n    max_page_size: int = MAX_PAGE_SIZE\n    max_items_per_user:\
    \ int = 1000\n    export_rate_limit: int = DEFAULT_EXPORT_RATE_LIMIT\n    export_rate_window_s: float\
    \ = DEFAULT_EXPORT_RATE_WINDOW_S\n\n    @classmethod\n    def from_env(cls) -> \"Settings\":\n   \
    \     raw_keys = os.environ.get(\"ITEMS_API_KEYS\")\n        return cls(\n            db_path=os.environ.get(\"\
    ITEMS_DB_PATH\", \"items.db\"),\n            api_keys=_parse_keys(raw_keys) if raw_keys else dict(DEFAULT_API_KEYS),\n\
    \            default_page_size=int(os.environ.get(\"ITEMS_PAGE_SIZE\", DEFAULT_PAGE_SIZE)),\n    \
    \        max_page_size=int(os.environ.get(\"ITEMS_MAX_PAGE_SIZE\", MAX_PAGE_SIZE)),\n            max_items_per_user=int(os.environ.get(\"\
    ITEMS_MAX_PER_USER\", 1000)),\n            export_rate_limit=int(\n                os.environ.get(\"\
    ITEMS_EXPORT_RATE_LIMIT\", DEFAULT_EXPORT_RATE_LIMIT)\n            ),\n            export_rate_window_s=float(\n\
    \                os.environ.get(\"ITEMS_EXPORT_RATE_WINDOW_S\", DEFAULT_EXPORT_RATE_WINDOW_S)\n  \
    \          ),\n        )\n"
- at: 30.1
  do: write_file
  path: app/ratelimit.py
  content: "\"\"\"Per-user fixed-window rate limiter (in memory, thread-safe).\"\"\"\nfrom __future__\
    \ import annotations\n\nimport math\nimport threading\nimport time\nfrom typing import Callable, Dict,\
    \ Tuple\n\n\nclass RateLimiter:\n    \"\"\"Allow at most ``limit`` hits per user in each ``window_s``-second\
    \ window.\n\n    The window for a user starts at that user's first counted hit.\n    \"\"\"\n\n  \
    \  def __init__(\n        self,\n        limit: int,\n        window_s: float,\n        clock: Callable[[],\
    \ float] = time.monotonic,\n    ) -> None:\n        self.limit = limit\n        self.window_s = window_s\n\
    \        self._clock = clock\n        self._lock = threading.Lock()\n        self._state: Dict[int,\
    \ Tuple[float, int]] = {}  # user -> (window_start, count)\n\n    def hit(self, user_id: int) -> Tuple[bool,\
    \ int]:\n        \"\"\"Count a hit. Return ``(allowed, retry_after_s)``; a denied hit is not counted.\"\
    \"\"\n        now = self._clock()\n        with self._lock:\n            start, count = self._state.get(user_id,\
    \ (now, 0))\n            if now - start >= self.window_s:\n                start, count = now, 0\n\
    \            if count >= self.limit:\n                return False, max(1, math.ceil(start + self.window_s\
    \ - now))\n            self._state[user_id] = (start, count + 1)\n            return True, 0\n"
