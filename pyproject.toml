[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lrae"
version = "0.1.0"
description = "Long-Running Agent Evaluation framework"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml", "psutil", "numpy", "scipy", "matplotlib", "jinja2"]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "ruff"]
ui = ["fastapi", "uvicorn[standard]", "httpx"]

[project.scripts]
lrae = "runner.cli:main"

[tool.setuptools]
packages = ["spec", "runner", "runner.runtimes", "telemetry", "guardrails", "scorer", "scorer.metrics", "analysis", "report", "ui_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not api and not local and not slow' -q"
markers = [
  "unit: fast tests, no agent subprocess",
  "local: spawns real local processes (scripted runtime, receiver, scorer); no API spend",
  "api: real Anthropic spend; run only with --run-api and LRAE_CONFIRM_SPEND=1",
  "slow: long local tests (multi-minute end-to-end runs, full per-stage sweeps); run before merging",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["fixtures", ".venv", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B011"]
