# Context windows (tokens) by model id, used for the context_fill counter (docs/spec.md §6.3).
# Lookup: exact id, then longest prefix (so dated ids like claude-opus-5-5-20260101 match), then the
# stream-json result.modelUsage[*].contextWindow when present, then default_context_window.
# An id ending in "[1m]" is looked up without the suffix and gets 1_000_000.
default_context_window: 200000
models:
  claude-opus-5-5: 200000
  claude-sonnet-5-5: 200000
  claude-haiku-5-5: 200000   # verified: modelUsage.contextWindow in fixtures/stream (CLI 1.0.126)
