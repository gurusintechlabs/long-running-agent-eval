# APPLICATION CONTEXT for the AI vulnerability review (scorer/vuln_review_prompt.md, plan B4).
name: minidb (a small SQL database engine)
component: the whole engine package minidb/ (lexer, parser, planner, executor, storage, durable storage)
languages: Python 3.13, standard library only
communicates_with: one client process over stdin/stdout (JSON lines, minidb/protocol.py); a database file given with --db PATH
threat_model: >-
  The SQL text and the database file are untrusted input: a client may send arbitrary statements, and a
  database file may have been tampered with. There is no network listener, no authentication and no
  multi-tenancy in this version.
ai_integrations: none
