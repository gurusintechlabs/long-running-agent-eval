    item limit reached\")\n        item = store.create_item(\n            user_id, body.title, body.description,\
    \ body.quantity\n        )\n        audit.record(user_id, \"item.create\", f\"id={item['id']} slug={item['slug']}\"\
    )\n        return item\n\n    @app.get(\"/items/{item_id}\", response_model=ItemOut)\n    def get_item(\n\
