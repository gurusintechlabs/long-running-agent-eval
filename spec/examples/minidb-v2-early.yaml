# First real run on minidb v2 (owner-approved 2026-10-17): 1 x 2 h, $40 agent cap, judge 1x.
# Staged long-horizon task L3: minidb v2 (docs/minidb-v2-design.md). The brief arrives in seven
# stages over the run (fixtures/tasks/minidb_v2/stages.yaml): a core engine at t=0, then new
# features and change requests that force revision of earlier code (indexes and hard performance
# limits, transactions and crash-safe storage, NULL-order / division / error-type changes,
# case-preserving names, a DATE type). The hidden tests of each stage (LRAE_STAGE) re-exercise
# earlier features; retired tests are replaced by change-request tests. Model and CLI version are
# set ONLY here.
spec_version: 1
experiment_id: minidb-v2-early
task:
  id: minidb-v2
  class: L3
  prompt_file: ../../fixtures/tasks/minidb_v2/stage0.md
  stages_file: ../../fixtures/tasks/minidb_v2/stages.yaml
  seed_repo: ../../fixtures/seed_minidb
  seed_commit: 53b58af0b1b07b10252d0fe5cad8d8b2578e0700   # same seed as minidb (L2)
  seed_requirements_lock: ../../fixtures/seed_minidb/requirements.lock
  constraints_file: ../../fixtures/tasks/minidb_v2/constraints.yaml
  hidden_tests: ../../fixtures/tasks/minidb_v2/hidden
agent:
  runtime: claude_code
  claude_bin: claude
  claude_code_version: "2.1.301"       # must equal `claude --version` at run start
  model: claude-opus-5-5               # <- CHANGE AGENT MODEL HERE
  auto_memory: cli_default
run:
  duration_min: 120                    # stages at 0, 15, 30, 45, 60, 75, 90 min (stages.yaml at_frac)
  checkpoint_interval_min: 20
  repeats: 1
  configs: [A]
  seed: 1234
  parallelism: 1
budget:                                # subscription login: $ = API-equivalent estimate (D-16)
  per_run_usd: 40.00                   # owner-approved hard cap (estimated $), 2026-10-17
  experiment_usd: 40.00
isolation:
  mode: local
  work_dir: ~/lrae-work
  keep_work_dir: false
telemetry:
  protocol: http/json
  export_interval_ms: 1000
guardrails:
  policy_file: ../../guardrails/rules/default.yaml
scoring:
  judge_model: claude-opus-5-5         # <- CHANGE JUDGE MODEL HERE
  judge_samples: 1                     # owner-approved: 1 judge call per checkpoint
  judge_runtime: claude_code
  thresholds:
    repeat_work_ratio: 0.30
    cost_per_commit_multiplier: 2.0
    cost_baseline_checkpoints: 2
