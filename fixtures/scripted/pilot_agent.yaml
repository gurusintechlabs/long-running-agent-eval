  content: "import csv\nimport io\n\nimport pytest\nfrom fastapi.testclient import TestClient\n\nfrom\
    \ app import audit\nfrom app.config import Settings\nfrom app.main import create_app\nfrom app.ratelimit\
    \ import RateLimiter\n\nHEADER = [\"id\", \"title\", \"slug\", \"description\", \"quantity\", \"created_at\"\
    ]\n\n\n@pytest.fixture()\ndef xclient():\n    settings = Settings(db_path=\":memory:\", export_rate_limit=3,\
    \ export_rate_window_s=3600)\n    with TestClient(create_app(settings=settings)) as c:\n        yield\
    \ c\n\n\ndef _rows(resp):\n    return list(csv.reader(io.StringIO(resp.text, newline=\"\")))\n\n\n\
    def _add(client, headers, n, prefix=\"item\"):\n    for i in range(n):\n        assert client.post(\"\
    /items\", json={\"title\": f\"{prefix} {i}\"}, headers=headers).status_code == 201\n\n\ndef _export_audit(user_id=None):\n\
    \    return [e for e in audit.list_entries(user_id=user_id, limit=1000) if e[\"action\"] == \"export.csv\"\
    ]\n\n\ndef test_export_requires_api_key(xclient):\n    assert xclient.get(\"/export\").status_code\
    \ == 401\n    assert xclient.get(\"/export\", headers={\"X-API-Key\": \"nope\"}).status_code == 401\n\
    \    assert _export_audit() == []\n\n\ndef test_export_csv_header_and_rows(xclient, alice):\n    xclient.post(\"\
    /items\", json={\"title\": \"Blue Widget\", \"description\": \"d\", \"quantity\": 4}, headers=alice)\n\
    \    xclient.post(\"/items\", json={\"title\": \"Plain\"}, headers=alice)\n    r = xclient.get(\"\
    /export\", headers=alice)\n    assert r.status_code == 200\n    assert r.headers[\"content-type\"\
    ].startswith(\"text/csv\")\n    rows = _rows(r)\n    assert rows[0] == HEADER\n    assert rows[1][1:5]\
    \ == [\"Blue Widget\", \"blue-widget\", \"d\", \"4\"]\n    assert rows[2][1:5] == [\"Plain\", \"plain\"\
    , \"\", \"1\"]\n    assert r.headers[\"x-total-count\"] == \"2\"\n\n\ndef test_export_pagination(xclient,\
    \ alice):\n    _add(xclient, alice, 5)\n    page = _rows(xclient.get(\"/export?limit=2&offset=2\"\
    , headers=alice))\n    assert [r[1] for r in page[1:]] == [\"item 2\", \"item 3\"]\n    assert len(_rows(xclient.get(\"\
    /export?offset=99\", headers=alice))) == 1\n    assert len(_rows(xclient.get(\"/export?limit=0\",\
    \ headers=alice))) == 2\n\n\ndef test_export_only_own_items(xclient, alice, bob):\n    _add(xclient,\
    \ alice, 2, \"a\")\n    _add(xclient, bob, 1, \"b\")\n    assert [r[1] for r in _rows(xclient.get(\"\
    /export\", headers=bob))[1:]] == [\"b 0\"]\n\n\ndef test_export_escapes_special_characters(xclient,\
    \ alice):\n    title = 'say \"hi\", ok'\n    desc = \"line1\\nline2\"\n    xclient.post(\"/items\"\
    , json={\"title\": title, \"description\": desc}, headers=alice)\n    rows = _rows(xclient.get(\"\
    /export\", headers=alice))\n    assert rows[1][1] == title and rows[1][3] == desc\n\n\ndef test_export_invalid_params_422_not_counted(xclient,\
    \ alice):\n    assert xclient.get(\"/export?limit=abc\", headers=alice).status_code == 422\n    assert\
    \ xclient.get(\"/export?offset=x\", headers=alice).status_code == 422\n    assert _export_audit()\
    \ == []\n    for _ in range(3):\n        assert xclient.get(\"/export\", headers=alice).status_code\
    \ == 200\n\n\ndef test_export_rate_limit_per_user(xclient, alice, bob):\n    for _ in range(3):\n\
    \        assert xclient.get(\"/export\", headers=alice).status_code == 200\n    r = xclient.get(\"\
    /export\", headers=alice)\n    assert r.status_code == 429\n    assert int(r.headers[\"retry-after\"\
    ]) >= 1\n    assert xclient.get(\"/export\", headers=bob).status_code == 200\n    assert xclient.get(\"\
    /items\", headers=alice).status_code == 200\n    assert len(_export_audit(user_id=1)) == 3\n\n\ndef\
    \ test_export_audit_entry_per_success(xclient, alice):\n    xclient.get(\"/export\", headers=alice)\n\
    \    xclient.get(\"/export?limit=1\", headers=alice)\n    entries = _export_audit(user_id=1)\n   \
    \ assert len(entries) == 2 and all(e[\"user_id\"] == 1 for e in entries)\n\n\ndef test_rate_limiter_window_resets():\n\
    \    now = [0.0]\n    rl = RateLimiter(2, 10, clock=lambda: now[0])\n    assert rl.hit(1)[0] and rl.hit(1)[0]\n\
    \    allowed, retry = rl.hit(1)\n    assert not allowed and retry == 10\n    assert rl.hit(2)[0]\n\
    \    now[0] = 10.0\n    assert rl.hit(1)[0]\n"
