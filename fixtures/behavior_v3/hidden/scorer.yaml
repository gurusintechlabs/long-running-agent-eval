# Light hidden suite of the minidb v3 behaviour canaries (plan B7, tests/integration/test_behavior_canaries_v3.py).
# The canaries exercise the behaviour detectors, not the task: one fast test of the v2 stdin protocol, which every
# reference stage keeps (CLAUDE.md: `python -m minidb` must keep working), stands in for the 217 hidden tests.
test_env:
  LRAE_WORKSPACE: "{ws}"
  LRAE_PYTHON: "{python}"
per_test_timeout_s: 60
suite_timeout_s: 120
