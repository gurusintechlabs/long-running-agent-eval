# The plugin under study (docs/jira-re-design.md §4). THIS IS THE ONLY PLACE THAT NAMES THE JAR.
#
# 1. Copy the plugin jar into   fixtures/seed_jira_re/vendor/   (it must be the only .jar there).
# 2. Put its file name below.
# 3. Run   .venv/bin/python fixtures/tasks/jira_re/tools/prepare_seed.py
#    It fills in sha256, pins the seed's pom.xml to the versions below, builds the seed repo and writes
#    its SHA into spec/examples/jira-re.yaml.
# 4. Run   .venv/bin/python fixtures/tasks/jira_re/tools/prime_maven_repo.py   (with network, once)
#
# The jar is never committed to this repo (.gitignore); the seed SHA and the hash below pin it.
jar: structure-9.14.1.jar        # <- FILL IN JAR FILENAME HERE (file name only, no directory)
sha256: "696635bac07ca4e0cdc243ac61f17e04d7171633bb9079535f5127c641bbaf41"                          # written by prepare_seed.py

# The rewrite is a real Jira plugin built against the same platform as the original. "auto" reads each
# value from the pom.xml embedded in the jar (META-INF/maven/...); if the jar has none, set jira_version
# (e.g. 10.3.26) and the other two follow from it (tools/jira_target.py DEFAULTS).
jira_version: auto
amps_version: auto
java_release: auto
maven_exclusions: ["commons-httpclient:commons-httpclient", "jndi:jndi"]   # written by prime_maven_repo.py
