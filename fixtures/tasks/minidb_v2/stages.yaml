# minidb v2: the brief arrives in stages (docs/interfaces.md §9, D-18; docs/minidb-v2-design.md).
# Stage 0 is the t=0 brief (task.prompt_file, constraints appended by the runtime); every later
# stage is a product-owner message delivered at the first turn boundary at or after
# at_frac x duration (240 min: 0, 30, 60, 90, 120, 150, 180 min).
stages:
  - {id: 0, prompt: stage0.md, at_frac: 0.0, kind: feature}          # core engine (sections 1-7)
  - {id: 1, prompt: stage1.md, at_frac: 0.125, kind: feature}        # subqueries, CASE/CAST, set ops, INSERT..SELECT, derived tables
  - {id: 2, prompt: stage2.md, at_frac: 0.25, kind: feature}         # indexes, planner, performance limits
  - {id: 3, prompt: stage3.md, at_frac: 0.375, kind: change_request} # CR-1 NULL order, CR-2 division, CR-3 storage errors
  - {id: 4, prompt: stage4.md, at_frac: 0.5, kind: feature}          # transactions, durable storage + crash recovery, ALTER TABLE
  - {id: 5, prompt: stage5.md, at_frac: 0.625, kind: feature}        # views, WITH / WITH RECURSIVE, window functions
  - {id: 6, prompt: stage6.md, at_frac: 0.75, kind: change_request}  # CR-4 case-preserving names, DATE type
max_wait_frac: 0.05   # 12 min at 240 min: a turn still running then is interrupted for the stage
